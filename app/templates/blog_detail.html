{% extends "layout.html" %}

{% block content %}

<h3 class="display-1 text-center">{{ blog.title }}</h3>

<div class="container my-4">
  <div class="row">
    <div class="col-12 col-md-10 col-lg-8 mx-auto">

      <div class="mb-4 py-4 px-5 shadow-lg rounded-4 border border-5">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <p class="mb-0 mt-2 small text-muted">{{ blog.author }} | {{ blog.date_posted }}</p>
        </div>
        <p class="mb-0">{{ blog.content }}</p>
      </div>

    </div>
  </div>
</div>

{% endblock %}
