{% extends "layout.html" %}
{% block content %}

<section id="intro">

  <div class="container-lg my-5">
    
    <div class="row justify-content-center">
      <div class="col-md text-center text-md-start">
        <h1 class="display-2">Today's Tasks</h1>
        <p class="display-6 text-muted fst-italic">{{ quote }}</p>
      </div>
    </div>

    <!-- task list -->
    <div class="row justify-content-center mt-4">
      <div class="col-12 col-md-8">
        <ul class="list-group shadow-sm">
          {% for task in tasks %}
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <span>{{ task.title }}</span>
            <span class="badge bg-secondary">{{ task.due }}</span>
          </li>
          {% else %}
          <li class="list-group-item text-muted">Nothing today.</li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
</section>

{% endblock %}
