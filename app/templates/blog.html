{% extends "layout.html" %}

{% block content %}



<!-- container = centres content + caps width. Without it, text stretches edge-to-edge on wide screens. -->
<div class="container my-4">
<h3 class="display-1">Devlog</h3>

  <!-- row/col: on phones (default) full width; on medium+ screens, 8/12 width centred via mx-auto -->
  <div class="row">
    <div class="col-12 col-md-10 col-lg-8 mx-auto">

    {% for blog in blogs %}
    <!-- post = plog_id -->
        <div class="mb-4 py-4 px-5 shadow-lg rounded-4 border border-5">
          <div class="d-flex justify-content-between align-items-start mb-2">
          <a class="lead mb-0 text-decoration-none" href="{{ request.url_for('blog_detail', blog_id=blog.id) }}">{{ blog.title }}</a>          <p class="mb-0 mt-2 small text-muted">{{ blog.author }} | {{ blog.date_posted }}</p> 
        </div>
        <p class="mb-0">{{ blog.content }}</p>
      </div>
      {% endfor %}

    </div>
  </div>
</div>

{% endblock %}
